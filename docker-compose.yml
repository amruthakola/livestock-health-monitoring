services:

  backend:
    build: ./backend
    container_name: livestock-backend
    expose:
      - "5000"
    environment:
      DATABASE_PATH: /data/livestock.db
    volumes:
      - livestock_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: livestock-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  livestock_data: